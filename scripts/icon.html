<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>App icon source</title>
<style>
  /* Sumber ikon PWA/apple-touch. Render dengan --window-size=512,512 dan 192,192. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030616; }
  .icon {
    width: 100vmin; height: 100vmin;
    background: linear-gradient(140deg, #6366f1, #818cf8 55%, #22d3ee);
    display: grid; place-items: center;
    font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif;
    font-size: 34vmin; font-weight: 800; letter-spacing: -0.04em;
    color: #030616;
  }
</style>
</head>
<body>
  <div class="icon">HS</div>
</body>
</html>
