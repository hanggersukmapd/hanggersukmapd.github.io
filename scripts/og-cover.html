<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>OG cover source — 1200x630</title>
<style>
  /* Sumber gambar pratinjau tautan. Render ulang dengan:
     chrome --headless=new --window-size=1200,630 --screenshot=assets/img/og-cover.png scripts/og-cover.html
     (lihat README bagian "Regenerasi aset gambar") */
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #030616;
    color: #e6ecf7;
    font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute; inset: -30%;
    background:
      radial-gradient(38rem 30rem at 84% 6%, rgba(99, 102, 241, 0.42), transparent 62%),
      radial-gradient(30rem 24rem at 8% 88%, rgba(34, 211, 238, 0.26), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(148, 163, 184, 0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148, 163, 184, 0.09) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at 30% 20%, #000 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 30% 20%, #000 0%, transparent 72%);
  }
  .frame {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; color: #a5b4fc;
  }
  .eyebrow::before {
    content: ""; width: 44px; height: 2px;
    background: linear-gradient(90deg, transparent, #818cf8);
  }
  h1 {
    margin: 22px 0 0;
    font-size: 78px; line-height: 1.03; letter-spacing: -0.035em; font-weight: 800;
  }
  h1 .accent {
    background-image: linear-gradient(100deg, #818cf8, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 22px; max-width: 660px;
    font-size: 23px; line-height: 1.45; color: #9aa8bd;
  }
  .chips { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid rgba(148, 163, 184, 0.28);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 999px; padding: 8px 16px;
    font-size: 16px; color: #cbd5e1;
  }
  .footer {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    border-top: 1px solid rgba(148, 163, 184, 0.18); padding-top: 22px;
    font-size: 17px; color: #7c8ba3;
  }
  .monogram {
    position: absolute; right: 72px; top: 50%; transform: translateY(-50%);
    width: 196px; height: 196px; border-radius: 44px;
    background: linear-gradient(140deg, #6366f1, #818cf8 55%, #22d3ee);
    display: grid; place-items: center;
    font-size: 78px; font-weight: 800; color: #030616; letter-spacing: -0.04em;
    box-shadow: 0 40px 90px -30px rgba(99, 102, 241, 0.85);
  }
  .tail { text-align: right; font-size: 16px; color: #7c8ba3; line-height: 1.6; }
  .tail strong { color: #e6ecf7; font-weight: 600; display: block; font-size: 19px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="frame">
    <div>
      <span class="eyebrow">Portfolio · 2026</span>
      <h1>Hangger Sukma<br /><span class="accent">Prima Darsono</span></h1>
      <p class="sub">
        Informatics Engineering Student — Data Science, Machine Learning
        &amp; Web Development Enthusiast.
      </p>
      <div class="chips">
        <span class="chip">Data Science</span>
        <span class="chip">Machine Learning</span>
        <span class="chip">Web Development</span>
        <span class="chip">Leadership</span>
      </div>
    </div>

    <div class="footer">
      <span>hanggersukmapd@gmail.com · Jakarta Selatan, DKI Jakarta</span>
      <span>github.com/hanggersukmapd</span>
    </div>
  </div>

  <div class="monogram">HS</div>
</body>
</html>
